<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120303" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Crimson Neon Gradient -->
    <linearGradient id="crimsonNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#8A0000" />
    </linearGradient>

    <!-- Silver White Accent -->
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A0AEC0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Rim -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#E10600" stroke-width="1.8" stroke-opacity="0.8" />
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#crimsonNeon)" stroke-width="1.2" stroke-dasharray="7 3" opacity="0.35" />

  <!-- Stylized Cyber Silhouette Avatar Mark -->
  <g filter="url(#crimsonGlow)">
    <!-- Head / Hair Silhouette -->
    <path d="M26 14 C 29 12, 35 12, 38 14 C 41 16, 42 19, 41 22 C 40 23, 40 25, 41 27 C 41.5 28.5, 40 31, 38 32 C 36 33, 34 33.5, 32 33.5 C 29 33.5, 27 32.5, 25.5 31 C 24 29.5, 23 27, 23 24 C 23 18, 24 15, 26 14 Z" fill="url(#silverAccent)" />
    
    <!-- Neon Cyber Visor / Eye Horizon Line -->
    <path d="M29 23 L39 23" stroke="#FF2E2E" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="40" cy="23" r="1.5" fill="#FF5252" />

    <!-- Sharp Suit Shoulders / Cyber Collar Silhouette -->
    <path d="M14 50 C 15 42, 20 37, 27 36 L 32 40 L 37 36 C 44 37, 49 42, 50 50 Z" fill="#181A22" stroke="url(#crimsonNeon)" stroke-width="1.5" />
    
    <!-- Central Tie / V-Neck Crimson Seam -->
    <path d="M32 40 L 32 50" stroke="#FF2E2E" stroke-width="1.8" stroke-linecap="round" />
    <polygon points="30,42 34,42 33,48 31,48" fill="#E10600" />
  </g>

  <!-- Tech Telemetry Dot in Corner -->
  <circle cx="51" cy="13" r="2.5" fill="#00FF88" />
  <circle cx="51" cy="13" r="4.5" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.5" />
</svg>